# 🔥 Nginx del ambiente de DESARROLLO (svua-dev).
#
# A diferencia de nginx.conf (produccion), este NO maneja certificados ni
# certbot: el HTTPS de dev.svua.cl lo termina el nginx de PRODUCCION (el
# unico contenedor con los puertos 80/443 publicados en la VPS), que le
# hace proxy_pass a este contenedor a traves de la red externa compartida
# "edge_net" (ver docker-compose.yml y el bloque "server_name dev.svua.cl"
# en frontend/nginx.conf). Por eso este archivo escucha simple, en HTTP,
# puerto 80.
server {
    listen 80;
    server_name dev.svua.cl api-dev.svua.cl;

    client_max_body_size 100M;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # 🔥 NO CACHE index.html
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    location /ws {

        proxy_pass http://backend:8080/ws;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;

    }

    location /api/ {
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
