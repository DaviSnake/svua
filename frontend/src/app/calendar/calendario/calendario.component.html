<div class="calendar-wrapper">
  <!-- 🔹 Header -->
  <div class="header">
    <div>
      <h1>Calendario</h1>
      <p>Gestión de orden de mantención y programación</p>
    </div>
  </div>
  <!-- 🔹 Calendario -->
  <div class="calendar-container">
    <full-calendar [options]="calendarOptions"></full-calendar>
  </div>
  <!-- 🔹 Modal -->
<div *ngIf="mostrarModal" class="modal-backdrop">
  <div class="modal">

    <!-- Header -->
    <div class="modal-header">
      <h2>{{ titulo }}</h2>
      <button class="close-btn" (click)="cerrar()">✕</button>
    </div>

    <!-- Form -->
    <form [formGroup]="ordenMantencionForm" class="form">

      <div class="form-group">
        <label>Título</label>
        <input type="text" formControlName="titulo" placeholder="Ej: Mantención preventiva" />
      </div>

      <div class="form-group">
        <label>Descripción</label>
        <textarea formControlName="observaciones" placeholder="Detalle de la mantención"></textarea>
      </div>

      <div class="form-group">
        <label>Lugar</label>
        <input type="text" formControlName="lugar" />
      </div>

      <div class="form-group">
        <label>Activo</label>
        <select formControlName="activoId">
          <option [ngValue]="null" disabled>Seleccione un activo</option>
          <option *ngFor="let activo of activos" [value]="activo.id">
            {{ activo.nombre }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label>Hora</label>
        <input type="time" formControlName="hora" />
      </div>

      <!-- Acciones -->
      <div class="acciones">

        <button class="btn ghost" type="button" (click)="cerrar()">
          Cancelar
        </button>

        <ng-container *ngIf="estadoOrden !== 'COMPLETADA'">
          <button 
            *ngIf="modoEdicion"
            class="btn danger"
            type="button"
            (click)="eliminar()">
            Eliminar
          </button>
  
          <!-- 🔥 NUEVO BOTÓN -->
          <button 
            *ngIf="modoEdicion" 
            class="btn"
            [ngClass]="estadoOrden === 'EN_EJECUCION' ? 'danger' : 'success'"
            type="button"
            (click)="toggleMantencion()">
  
            {{ estadoOrden === 'EN_EJECUCION' 
                ? '⏹ Terminar mantención' 
                : '▶ Iniciar mantención' }}
          </button>
  
          <button 
            class="btn primary"
            type="button"
            (click)="guardar()"
            [disabled]="ordenMantencionForm.invalid">
            {{ modoEdicion ? 'Actualizar' : 'Guardar' }}
          </button>

        </ng-container>

      </div>

    </form>

  </div>
</div>
</div>
