<div class="container">

  <h2>🏢 Gestión de Empresas</h2>

  <!-- FORM -->
  <form [formGroup]="empresaForm" (ngSubmit)="guardar()">

    <!-- ========================= -->
    <!-- DATOS EMPRESA -->
    <!-- ========================= -->
    <div class="card-section">
      <h3>Datos de la Empresa</h3>

      <input class="span-2" placeholder="Nombre" formControlName="nombre">
      <input class="span-2" placeholder="RUT" formControlName="rut">
      <input class="span-2" placeholder="Email contacto" formControlName="emailContacto">
      <input class="span-2" placeholder="Teléfono" formControlName="telefono">
      <div *ngIf="empresaForm.get('telefono')?.touched && empresaForm.get('telefono')?.invalid">
        <small *ngIf="empresaForm.get('telefono')?.errors?.['pattern']">
          Solo se permiten números
        </small>
      </div>
      <input class="span-2" placeholder="Dirección" formControlName="direccion">

      <select formControlName="tipoPlan">
        <option value="FREE">FREE</option>
        <option value="BASICO">BASICO</option>
        <option value="PROFESIONAL">PROFESIONAL</option>
        <option value="ENTERPRISE">ENTERPRISE</option>
      </select>

      <!-- 🔹 Configuracion: empresa demo + codigos QR/EAN13 de activos
           (controla si Escanear Activo y el QR/EAN13 del modal "Ver" de
           Activo estan disponibles para esta empresa). -->
      <div class="config-flags">
        <label class="checkbox-label">
          <input type="checkbox" formControlName="demo">
          Empresa Demo
        </label>
        <label class="checkbox-label">
          <input type="checkbox" formControlName="codigoQrHabilitado">
          Código QR habilitado
        </label>
        <label class="checkbox-label">
          <input type="checkbox" formControlName="codigoEan13Habilitado">
          Código EAN13 habilitado
        </label>
        <label class="checkbox-label">
          <input type="checkbox" formControlName="controlTurnoHabilitado">
          Control de Turno habilitado
        </label>
        <label class="checkbox-label">
          <input type="checkbox" formControlName="hojaControlHabilitado">
          Importar Excel (Hoja de Control) habilitado
        </label>
        <label class="checkbox-label">
          <input type="checkbox" formControlName="informeMantencionesHabilitado">
          Informe de Mantenciones habilitado
        </label>
      </div>

      <!-- 🎨 Personalización: color de acento (sidebar) y logo propio.
           El logo solo se puede subir editando una empresa ya creada
           (necesita su id para el endpoint de subida). -->
      <div class="personalizacion">
        <label class="color-label">
          Color de acento
          <input type="color" formControlName="colorPrimario">
        </label>

        <div *ngIf="editando" class="logo-upload">
          <label>Logo</label>
          <img *ngIf="logoPreviewUrl" [src]="logoPreviewUrl" class="logo-preview" alt="Logo actual">
          <input type="file" accept="image/*" (change)="subirLogo($event)" [disabled]="subiendoLogo">
          <small *ngIf="subiendoLogo">Subiendo…</small>
        </div>
      </div>
    </div>

    <!-- ========================= -->
    <!-- ADMIN (OCULTO) -->
    <!-- ========================= -->
    <div class="card-section admin-section">

      <div *ngIf="!editando">
        <div class="admin-header" (click)="onAdminClick();">
          <h3>👤 Administrador</h3>
          <span>{{ mostrarAdmin ? '▲' : '▼' }}</span>
        </div>

        <div *ngIf="mostrarAdmin" class="admin-body">

          <input placeholder="Nombre Administrador" formControlName="adminNombre">
          <input placeholder="Email Administrador" formControlName="adminEmail">
          <div class="input-group password-group">
            <input [type]="showPassword ? 'text' : 'password'"  type="password" placeholder="Password" formControlName="adminPassword">
            <!-- 👁 toggle -->
            <span class="eye" (click)="togglePassword()">
              {{ showPassword ? '🙈' : '👁' }}
            </span>
          </div>

        </div>
      </div>

    </div>

    <!-- BOTONES -->
    <div class="acciones">
      <button type="submit">
        {{ editando ? 'Actualizar' : 'Crear' }}
      </button>

      <button type="button" (click)="resetForm()" *ngIf="editando">
        Cancelar
      </button>
    </div>

  </form>

  <!-- ========================= -->
  <!-- FILTRO -->
  <!-- ========================= -->
  <input
    class="filtro"
    type="text"
    placeholder="🔍 Buscar empresa..."
    [(ngModel)]="filtro"
    (input)="filtrar()"
  />

  <!-- ========================= -->
  <!-- TABLA -->
  <!-- ========================= -->
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>RUT</th>
          <th>Email</th>
          <th>Plan</th>
          <th>Acciones</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let e of empresasFiltradas; trackBy: trackByEmpresaId">
          <td>{{ e.nombre }}</td>
          <td>{{ e.rut }}</td>
          <td>{{ e.emailContacto }}</td>
          <td>
            <span class="badge" [ngClass]="e.tipoPlan">
              {{ e.tipoPlan }}
            </span>
          </td>

          <td>
            <button class="btn-editar" (click)="editar(e)">Editar</button>
            <button class="btn-eliminar" (click)="eliminar(e.id!)">Eliminar</button>
            <!-- 🖨️ Solo si la empresa tiene QR y/o EAN13 habilitado -->
            <button
              *ngIf="e.codigoQrHabilitado || e.codigoEan13Habilitado"
              class="btn-pdf"
              [disabled]="generandoPdfId === e.id"
              (click)="generarPdfCodigos(e)"
            >
              {{ generandoPdfId === e.id ? 'Generando...' : '🖨️ Códigos' }}
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
