# 🔁 HTTP → HTTPS
server {
    listen 80;
    server_name www.svua.cl svua.cl api.svua.cl;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 🔐 HTTPS
server {
    listen 443 ssl;
    server_name www.svua.cl svua.cl api.svua.cl;

    error_log /var/log/nginx/api-error.log debug;

    ssl_certificate /etc/letsencrypt/live/www.svua.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.svua.cl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 👇 Agregar aquí
    client_max_body_size 100M;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # 🔥 NO CACHE index.html
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    location /ws {

        proxy_pass http://svua_backend:8080/ws;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;

    }

    location /api/ {
        proxy_pass http://svua_backend:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}