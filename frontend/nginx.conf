# 🔁 HTTP → HTTPS
server {
    listen 80;
    server_name www.svua.cl svua.cl api.svua.cl dev.svua.cl api-dev.svua.cl;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 🔐 HTTPS
server {
    listen 443 ssl;
    server_name www.svua.cl svua.cl api.svua.cl;

    error_log /var/log/nginx/api-error.log debug;

    ssl_certificate /etc/letsencrypt/live/www.svua.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.svua.cl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 👇 Agregar aquí
    client_max_body_size 100M;

    # Headers de seguridad estandar (aplican a /api/ y /ws al heredarse;
    # location / los repite explicitamente mas abajo porque ya define
    # sus propios add_header y por eso no hereda estos).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # 🔥 NO CACHE index.html
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;

        # Headers de seguridad estandar (ver nota en el server{} de mas
        # arriba: este location no los hereda porque ya tiene sus propios
        # add_header).
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location /ws {

        proxy_pass http://backend:8080/ws;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;

    }

    location /api/ {
        proxy_pass http://backend:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 🔥 AMBIENTE DE DESARROLLO (svua-dev)
# Este nginx (el de PROD) es el unico que tiene puerto 80/443 publico
# y certificado real, asi que tambien termina el HTTPS de dev.svua.cl Y
# de api-dev.svua.cl (mismo bloque, mismo certificado con ambos SAN) y
# les hace proxy_pass "tal cual" (todo: estaticos, /api, /ws) al
# nginx interno del ambiente de desarrollo, que corre en la red
# externa compartida "edge_net" (ver docker-compose.yml) bajo el
# nombre svua_dev_frontend (PROJECT_NAME=svua_dev en svua-dev/.env). El
# ruteo /api/ y /ws se resuelve por PATH dentro del nginx interno de
# dev (nginx.dev.conf), no por dominio, asi que da lo mismo si el
# request llega por dev.svua.cl o por api-dev.svua.cl.
# El ambiente de desarrollo NO maneja su propio certificado ni
# certbot: ver frontend/nginx.dev.conf.
server {
    listen 443 ssl;
    server_name dev.svua.cl api-dev.svua.cl;

    error_log /var/log/nginx/dev-error.log debug;

    ssl_certificate /etc/letsencrypt/live/dev.svua.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.svua.cl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 100M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://svua_dev_frontend:80;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
