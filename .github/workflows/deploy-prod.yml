name: Deploy Prod

on:
  # 🔥 Ya no se deploya en cada push a master: mergear a master ya no
  # tumba el sitio solo. El deploy real a produccion pasa unicamente
  # al pushear un tag "vX.Y.Z", o manualmente eligiendo un tag
  # existente (sirve para reintentar un deploy o hacer rollback a una
  # version anterior sin tocar la rama).
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a desplegar (ej: v1.2.3). Puede ser uno anterior para rollback.'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS (prod)
        uses: appleboy/ssh-action@v1.0.3
        env:
          # 🔥 Si se disparo manualmente (workflow_dispatch) usa el tag
          # que se escribio a mano; si se disparo por push de un tag,
          # usa ese mismo tag (github.ref_name).
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: TAG_NAME

          script: |

            APP_DIR=/home/davisnake/svua-prod

            echo "🏷️  Desplegando tag: $TAG_NAME"

            echo "📁 Verificando proyecto..."

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "🚀 Primera instalación"

              git clone git@github.com:DaviSnake/svua.git $APP_DIR

              cd $APP_DIR
              mkdir -p certbot/www certbot/conf
            else
              echo "🔄 Actualizando proyecto"

              cd $APP_DIR
              git fetch origin --tags --force
            fi

            cd $APP_DIR

            # 🏷️ Deja el checkout apuntando exactamente al tag pedido
            # (detached HEAD: aca nunca se commitea nada, solo se
            # despliega codigo ya existente en el repo).
            git checkout "$TAG_NAME"

            if [ ! -f ".env" ]; then

              echo "Creando .env"
            cat > .env <<ENVEOF
            COMPOSE_PROJECT_NAME=svua
            PROJECT_NAME=svua
            HTTP_PORT=80
            HTTPS_PORT=443
            POSTGRES_HOST_PORT=5432
            NGINX_CONF_FILE=nginx.conf
            POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}
            POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            API_URL=${{ secrets.API_URL }}
            ENVEOF

            else
              echo ".env ya existe"

            fi

            echo "🐳 Levantando Docker"

            # 🔥 "down" SIN --profile: no toca el contenedor de certbot
            # (que corre en loop renovando el certificado) si ya esta
            # arriba. "up" SI lleva --profile prod: si por lo que sea
            # certbot no estuviera corriendo (reinicio de la VPS, etc.),
            # este deploy lo vuelve a levantar solo.
            docker compose down
            docker compose --profile prod up -d --build


            echo "✅ Valida si existe certificado SSL "
            if [ ! -f "certbot/conf/renewal/www.svua.cl.conf" ]; then

            echo "🔐 Generando SSL..."

              docker compose run --rm --entrypoint certbot certbot certonly \
                --webroot \
                --webroot-path=/var/www/certbot \
                -d www.svua.cl -d svua.cl -d api.svua.cl \
                --email dmedina.c@hotmail.com \
                --agree-tos \
                --no-eff-email
            else
              echo "✅ SSL ya existe"
            fi

            echo "✅ Deploy completado (prod) - tag: $TAG_NAME"
