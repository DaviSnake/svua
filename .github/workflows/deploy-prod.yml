name: Deploy Prod

on:
  # Deshabilitar WorkFlow
  #workflow_dispatch:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS (prod)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}

          script: |

            APP_DIR=/home/davisnake/svua-prod

            echo "📁 Verificando proyecto..."

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "🚀 Primera instalación"

              git clone -b master git@github.com:DaviSnake/svua.git $APP_DIR

              cd $APP_DIR
              mkdir -p certbot/www certbot/conf
            else
              echo "🔄 Actualizando proyecto"

              cd $APP_DIR
              git fetch origin
              git reset --hard origin/master
            fi

            cd $APP_DIR

            if [ ! -f ".env" ]; then

              echo "Creando .env"
            cat > .env <<ENVEOF
            COMPOSE_PROJECT_NAME=svua
            PROJECT_NAME=svua
            HTTP_PORT=80
            HTTPS_PORT=443
            POSTGRES_HOST_PORT=5432
            NGINX_CONF_FILE=nginx.conf
            POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}
            POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            API_URL=${{ secrets.API_URL }}
            ENVEOF

            else
              echo ".env ya existe"

            fi

            echo "🐳 Levantando Docker"

            # 🔥 "down" SIN --profile: no toca el contenedor de certbot
            # (que corre en loop renovando el certificado) si ya esta
            # arriba. "up" SI lleva --profile prod: si por lo que sea
            # certbot no estuviera corriendo (reinicio de la VPS, etc.),
            # este deploy lo vuelve a levantar solo.
            docker compose down
            docker compose --profile prod up -d --build


            echo "✅ Valida si existe certificado SSL "
            if [ ! -f "certbot/conf/renewal/www.svua.cl.conf" ]; then

            echo "🔐 Generando SSL..."

              docker compose run --rm --entrypoint certbot certbot certonly \
                --webroot \
                --webroot-path=/var/www/certbot \
                -d www.svua.cl -d svua.cl -d api.svua.cl \
                --email dmedina.c@hotmail.com \
                --agree-tos \
                --no-eff-email
            else
              echo "✅ SSL ya existe"
            fi

            echo "✅ Deploy completado (prod)"
