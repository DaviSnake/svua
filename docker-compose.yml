services:

  postgres:
    image: postgres:16
    container_name: ${PROJECT_NAME}_postgres
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5

  backend:
    build: ./svuaback
    container_name: ${PROJECT_NAME}_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    expose:
      - "8080"
    networks:
      - internal
    volumes:
    - ./uploads:/app/uploads
    # 🔥 Logs de errores de cargas masivas (ver ImportFileLogService /
    # pantalla "Ver Logs"): sin este volumen se pierden cada vez que se
    # reinicia o redespliega el contenedor.
    - ./log:/app/log
    # 🔒 Monta el .env real (solo lectura/escritura desde el propio
    # backend) para que la pantalla de Configuración (SUPER_ADMIN) pueda
    # leerlo y editarlo. Los cambios requieren reiniciar este contenedor
    # para tomar efecto (Spring solo lee estas variables al arrancar).
    - ./.env:/app/.env

  frontend:
    build: ./frontend
    container_name: ${PROJECT_NAME}_frontend
    restart: always
    env_file:
      - .env
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    volumes:
      - ./frontend/${NGINX_CONF_FILE:-nginx.conf}:/etc/nginx/conf.d/default.conf
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    networks:
      - internal
      # 🔥 Red compartida entre svua-prod y svua-dev: permite que el nginx
      # de PROD (el unico que tiene certificado real y escucha en el
      # 80/443 publicos) le haga proxy_pass a este contenedor cuando
      # corresponda (ver nginx.conf, bloque "server_name dev.svua.cl").
      # Se crea UNA sola vez en la VPS con:
      #   docker network create edge_net
      # y ambos ambientes (svua-prod y svua-dev) se conectan a ella.
      - edge_net

  # 🔥 Backup automatico de Postgres (NCh-ISO/IEC 27001 A.17 -
  # Continuidad del negocio) -- ver scripts/backup-postgres.sh y
  # docs/continuidad-negocio.md para el detalle completo (que cubre,
  # que NO cubre todavia, y como restaurar). Corre al levantar y
  # despues cada 24h (mismo patron del loop de certbot mas abajo).
  # Se levanta en TODOS los ambientes (no tiene --profile): dev tambien
  # tiene datos de prueba que conviene poder recuperar.
  postgres-backup:
    image: postgres:16
    container_name: ${PROJECT_NAME}_postgres_backup
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      - ./backups/postgres:/backups
      - ./scripts/backup-postgres.sh:/backup-postgres.sh:ro
      - ./scripts/backup-empresa.sh:/backup-empresa.sh:ro
      - ./scripts/restore-postgres.sh:/restore-postgres.sh:ro
    networks:
      - internal
    entrypoint: >
      /bin/sh -c "
      trap exit TERM;
      while :; do
        sh /backup-postgres.sh;
        sleep 24h & wait $${!};
      done"

  # 🔥 Solo se levanta en produccion (docker compose --profile prod up -d):
  # es el unico ambiente que necesita renovar un certificado real. Dev
  # no define este servicio en absoluto en su despliegue.
  certbot:
    image: certbot/certbot
    container_name: ${PROJECT_NAME}_certbot
    profiles: ["prod"]
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 12h & wait $${!}; certbot renew; done'"

volumes:
  postgres_data:
  certbot_www:
  certbot_conf:

networks:
  internal:
    name: ${PROJECT_NAME}_net
  edge_net:
    external: true
    name: edge_net
