services:

  postgres:
    image: postgres:16
    container_name: svua_postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - svua_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 5

  backend:
    build: ./svuaback
    container_name: svua_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOSTNAME: postgres
      DB_PORT: 5432
    ports:
      - "8080:8080"
    networks:
      - svua_net

  frontend:
    build: ./frontend
    container_name: svua_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - svua_net

volumes:
  postgres_data:

networks:
  svua_net:
    name: svua_net   # 👈 CLAVE