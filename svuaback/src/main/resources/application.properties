spring.application.name=svuaback

server.address=0.0.0.0
server.port=8080
server.forward-headers-strategy=framework

# =========================
# DATABASE
# =========================
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:svua}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =========================
# JWT
# =========================
jwt.secret=${JWT_SECRET}
jwt.expiration-token=${JWT_EXPIRATION_TOKEN:1200000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

spring.http.converters.preferred-json-mapper=jackson

# =========================
# SMTP (nexovectoria.cl)
# =========================
spring.mail.host=${MAIL_HOST:mail.nexovectoria.cl}
spring.mail.port=${MAIL_PORT:465}

spring.mail.username=${MAIL_USERNAME:soporte@nexovectoria.cl}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.protocol=smtp

# 🔥 puerto 465 = SSL implicito desde el inicio de la conexion, no
# STARTTLS (que es para el puerto 587, el proveedor anterior).
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.ssl.enable=true

# TLS / certificados
spring.mail.properties.mail.smtp.ssl.trust=mail.nexovectoria.cl

# Timeouts
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Debug (solo desarrollo)
logging.level.org.springframework.mail=INFO
logging.level.org.eclipse.angus.mail=INFO

# =========================
# FRONTEND
# =========================
app.frontend.url=${FRONTEND_URL:https://localhost:4200}

# =========================
# CORS
# En producción, defina CORS_ALLOWED_ORIGINS con la lista real separada por comas
# (ej: https://www.svua.cl,https://svua.cl,https://IP_DEL_SERVIDOR)
# =========================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost}

# =========================
# Datos iniciales (SOLO ambiente local). NUNCA activar en producción sin
# definir app.init-data.admin-password propio.
# =========================
app.init-data.enabled=${INIT_DEMO_DATA:false}
app.init-data.admin-email=${INIT_DEMO_ADMIN_EMAIL:admin@admin.com}
app.init-data.admin-password=${INIT_DEMO_ADMIN_PASSWORD:}

# =========================
# FLYWAY
# =========================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# =========================
# FRONTEND
# =========================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# =========================
# SCHEDULER
# =========================
svua.scheduler.mantenciones.enabled=${NOTIFICACION_MATENCIONES:true}
svua.scheduler.mantenciones.diasnotificacion=${DIAS_NOTIFICACION:1}
app.jobs.ordenes.cron=${HORA_NOTIFICACION:0 0 21 * * *}

# =========================
# Empresa Demo
# =========================
app.demo.empresa-id=${EMPRESA_DEMO_ID:3}
svua.scheduler.limpiezademo.enabled=${LIMPIEZA_DEMO_ENABLED:true}

# OCR / Tesseract. En Docker configure TESSERACT_DATA_PATH con la carpeta que contiene eng.traineddata.
ocr.tesseract.data-path=${TESSERACT_DATA_PATH:C:/Program Files/Tesseract-OCR/tessdata}
ocr.tesseract.language=${TESSERACT_LANGUAGE:eng}

# =========================
# CONFIGURACIÓN (pantalla SUPER_ADMIN que lee/edita el .env real)
# Ruta del archivo dentro del contenedor del backend (ver volumen en
# docker-compose.yml). Por defecto ".env" resuelve a /app/.env, ya que
# el WORKDIR de la imagen es /app.
# =========================
app.config.env-file=${ENV_FILE_PATH:.env}
