spring.application.name=svuaback

# =========================
# DATABASE
# =========================
spring.datasource.url=jdbc:postgresql://${DB_HOSTNAME:localhost}:${DB_PORT:5432}/${DB_NAME:svua}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# =========================
# JWT
# =========================
jwt.secret=${JWT_SECRET:ARACRIDAV_SVUA_586E3272357538782F413F4428472B4B6250655368566B597033733676397924}
jwt.expiration-token=${JWT_EXPIRATION_TOKEN:300000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

spring.http.converters.preferred-json-mapper=jackson

# =========================
# MAILCOW SMTP
# =========================
spring.mail.host=${MAIL_HOST:mail.svua.cl}
spring.mail.port=${MAIL_PORT:587}

spring.mail.username=${MAIL_USERNAME:soportesvua@svua.cl}
spring.mail.password=${MAIL_PASSWORD:soporte123}

spring.mail.protocol=smtp

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# TLS / certificados
spring.mail.properties.mail.smtp.ssl.trust=mail.svua.cl

# Timeouts
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Debug (solo desarrollo)
logging.level.org.springframework.mail=INFO
logging.level.org.eclipse.angus.mail=INFO

# =========================
# FRONTEND
# =========================
app.frontend.url=${FRONTEND_URL:https://localhost:4200}

# =========================
# FLYWAY
# =========================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration