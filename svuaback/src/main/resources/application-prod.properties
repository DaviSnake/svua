# =====================================================================
# Perfil de PRODUCCION. Se activa con SPRING_PROFILES_ACTIVE=prod (ver
# docker-compose.yml, servicio "backend", y el .env real de ese
# ambiente -- .env.example lo documenta).
#
# Hallazgo que motiva este archivo: db/migration-demo/V2__seed_data.sql
# crea, entre otras cosas, la cuenta SUPER_ADMIN inicial con un hash
# BCrypt FIJO, committeado en el repo. Sin este perfil, Flyway corre
# ese archivo en CUALQUIER base de datos nueva -- incluida una
# instalacion de produccion desde cero -- dejando una cuenta con el
# rol mas alto del sistema y una contraseña que cualquiera con acceso
# al repo (o a una copia filtrada) puede intentar crackear offline.
# =====================================================================

# 🔒 Excluye db/migration-demo (empresa demo, usuarios de prueba,
# puntos de control demo) -- solo corren las migraciones de ESQUEMA
# reales. Una produccion nueva arranca con la base de datos vacia,
# lista para que InitialDataConfig (ver mas abajo) cree la primera
# empresa y el primer SUPER_ADMIN con una contraseña real.
spring.flyway.locations=classpath:db/migration

# 🔒 La base de datos de produccion YA EXISTENTE (la que corre hoy en
# la VPS) tiene V2__seed_data.sql y V30__seed_puntos_control_demo.sql
# registrados en su flyway_schema_history desde antes de este cambio
# -- ya se aplicaron una vez y no se pueden "desaplicar" (ni hace
# falta: los datos que crearon siguen ahi, esto solo evita que
# vuelvan a aplicarse en una instalacion NUEVA). Sin este flag, Flyway
# fallaria el arranque con "Detected applied migration not resolved
# locally", porque esos dos archivos ya no estan en las locations de
# arriba para este perfil.
spring.flyway.ignore-migration-patterns=*:missing

# 🔒 Bootstrap del primer SUPER_ADMIN en una instalacion de produccion
# REALMENTE nueva (base de datos vacia). InitialDataConfig solo actua
# si "empresaRepo.count() == 0" -- en la base de datos actual (que ya
# tiene empresas) esto no hace nada, es inofensivo dejarlo en true de
# forma permanente. Requiere ademas INIT_DEMO_ADMIN_PASSWORD (sin
# default): sin esa variable definida con una contraseña real, el
# propio InitialDataConfig se niega a crear la cuenta (ver su log de
# advertencia).
app.init-data.enabled=true
